services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksmct_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ksmct_storage:/var/www/html/storage/app
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ksmct_db}
      DB_USERNAME: ${DB_USERNAME:-ksmct_user}
      DB_PASSWORD: ${DB_PASSWORD:-ksmct_secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ksmct_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ksmct_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ksmct_net

  mysql:
    image: mysql:8.0
    container_name: ksmct_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ksmct_db}
      MYSQL_USER: ${DB_USERNAME:-ksmct_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ksmct_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - ksmct_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ksmct_net

volumes:
  ksmct_mysql_data:
  ksmct_storage:

networks:
  ksmct_net:
    driver: bridge
